<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIP ALG Checker - Web Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .results {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 5px;
            display: none;
        }

        .results.show {
            display: block;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9em;
            margin: 5px 0;
        }

        .status-unlikely {
            background: #d4edda;
            color: #155724;
        }

        .status-possible {
            background: #fff3cd;
            color: #856404;
        }

        .status-likely {
            background: #f8d7da;
            color: #721c24;
        }

        .quality-excellent {
            background: #d4edda;
            color: #155724;
        }

        .quality-good {
            background: #d1ecf1;
            color: #0c5460;
        }

        .quality-fair {
            background: #fff3cd;
            color: #856404;
        }

        .quality-poor {
            background: #f8d7da;
            color: #721c24;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .metric:last-child {
            border-bottom: none;
        }

        .metric-label {
            font-weight: 500;
            color: #555;
        }

        .metric-value {
            font-weight: 600;
            color: #333;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
        }

        .recommendation {
            background: #e7f3ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-top: 15px;
            line-height: 1.6;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 1s linear;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌐 SIP ALG Checker</h1>
            <p>Monitor your VoIP network quality and check for SIP ALG interference</p>
        </div>

        <div class="dashboard">
            <!-- SIP ALG Check Card -->
            <div class="card">
                <h2>🔍 SIP ALG Check</h2>
                <p style="margin-bottom: 15px; color: #666;">Check if SIP ALG is interfering with your VoIP traffic</p>
                <button class="button" onclick="checkSIPALG()">Check SIP ALG Status</button>
                
                <div id="alg-results" class="results">
                    <div id="alg-content"></div>
                </div>
            </div>

            <!-- Network Monitoring Card -->
            <div class="card">
                <h2>📊 Network Monitoring</h2>
                <p style="margin-bottom: 15px; color: #666;">Monitor network quality metrics in real-time</p>
                
                <div class="input-group">
                    <label for="target-ip">Target IP Address:</label>
                    <input type="text" id="target-ip" placeholder="e.g., 8.8.8.8" value="8.8.8.8">
                </div>

                <div class="input-group">
                    <label for="duration">Duration (seconds):</label>
                    <input type="number" id="duration" placeholder="60" value="60" min="10" max="3600">
                </div>

                <button class="button" id="monitor-btn" onclick="startMonitoring()">Start Monitoring</button>
                <button class="button" id="stop-btn" onclick="stopMonitoring()" style="display: none; background: #dc3545;">Stop Monitoring</button>
                
                <div id="monitor-results" class="results">
                    <div id="monitor-content"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let monitoringSession = null;
        let monitoringInterval = null;

        async function checkSIPALG() {
            const resultsDiv = document.getElementById('alg-results');
            const contentDiv = document.getElementById('alg-content');
            
            resultsDiv.classList.add('show');
            contentDiv.innerHTML = '<div class="loading">Checking SIP ALG status</div>';

            try {
                const response = await fetch('/api/check-alg', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({})
                });

                const data = await response.json();

                if (data.success) {
                    const results = data.results;
                    let statusClass = 'status-unlikely';
                    if (results.sip_alg_detected === 'LIKELY') statusClass = 'status-likely';
                    else if (results.sip_alg_detected === 'POSSIBLE') statusClass = 'status-possible';

                    let html = `
                        <div class="metric">
                            <span class="metric-label">Local IP:</span>
                            <span class="metric-value">${results.local_ip}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Status:</span>
                            <span class="status-badge ${statusClass}">${results.sip_alg_detected}</span>
                        </div>
                        <div class="recommendation">
                            <strong>Recommendation:</strong><br>
                            ${results.recommendation}
                        </div>
                    `;

                    if (results.checks_performed && results.checks_performed.length > 0) {
                        html += '<div style="margin-top: 15px;"><strong>Detailed Checks:</strong></div>';
                        results.checks_performed.forEach(check => {
                            html += `<div class="metric">
                                <span class="metric-label">${check.name}:</span>
                                <span class="metric-value">${check.status || check.behavior || check.open_ports + '/5'}</span>
                            </div>`;
                        });
                    }

                    contentDiv.innerHTML = html;
                } else {
                    contentDiv.innerHTML = `<div class="error">Error: ${data.error}</div>`;
                }
            } catch (error) {
                contentDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        async function startMonitoring() {
            const targetIP = document.getElementById('target-ip').value.trim();
            const duration = parseInt(document.getElementById('duration').value);
            const resultsDiv = document.getElementById('monitor-results');
            const contentDiv = document.getElementById('monitor-content');
            const monitorBtn = document.getElementById('monitor-btn');
            const stopBtn = document.getElementById('stop-btn');

            if (!targetIP) {
                alert('Please enter a target IP address');
                return;
            }

            if (duration < 10 || duration > 3600) {
                alert('Duration must be between 10 and 3600 seconds');
                return;
            }

            resultsDiv.classList.add('show');
            contentDiv.innerHTML = '<div class="loading">Starting monitoring</div>';
            monitorBtn.style.display = 'none';
            stopBtn.style.display = 'block';

            try {
                const response = await fetch('/api/start-monitor', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        target_ip: targetIP,
                        duration: duration
                    })
                });

                const data = await response.json();

                if (data.success) {
                    monitoringSession = data.session_id;
                    monitoringInterval = setInterval(updateMonitoringStatus, 1000);
                } else {
                    contentDiv.innerHTML = `<div class="error">Error: ${data.error}</div>`;
                    resetMonitoringUI();
                }
            } catch (error) {
                contentDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
                resetMonitoringUI();
            }
        }

        async function updateMonitoringStatus() {
            if (!monitoringSession) return;

            try {
                const response = await fetch(`/api/monitor-status/${monitoringSession}`);
                const data = await response.json();

                if (data.success) {
                    const stats = data.stats;
                    const elapsed = data.elapsed;
                    const remaining = data.remaining;
                    const running = data.running;

                    // Calculate quality
                    let quality = 'EXCELLENT';
                    let qualityClass = 'quality-excellent';
                    if (stats.packet_loss_percent > 1 || stats.jitter_ms > 30) {
                        quality = 'POOR';
                        qualityClass = 'quality-poor';
                    } else if (stats.packet_loss_percent > 0.5 || stats.jitter_ms > 20) {
                        quality = 'FAIR';
                        qualityClass = 'quality-fair';
                    } else if (stats.jitter_ms > 10) {
                        quality = 'GOOD';
                        qualityClass = 'quality-good';
                    }

                    // Calculate progress percentage
                    const totalDuration = elapsed + remaining;
                    const progressPercent = totalDuration > 0 ? (elapsed / totalDuration * 100) : 0;

                    let html = `
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progressPercent}%">${Math.round(progressPercent)}%</div>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Time Elapsed:</span>
                            <span class="metric-value">${Math.round(elapsed)}s / ${Math.round(elapsed + remaining)}s</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Target:</span>
                            <span class="metric-value">${stats.target}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Packets Sent:</span>
                            <span class="metric-value">${stats.packets_sent}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Packets Received:</span>
                            <span class="metric-value">${stats.packets_received}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Packet Loss:</span>
                            <span class="metric-value">${stats.packet_loss_percent}%</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Avg Latency:</span>
                            <span class="metric-value">${stats.avg_latency_ms}ms</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Min Latency:</span>
                            <span class="metric-value">${stats.min_latency_ms}ms</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Max Latency:</span>
                            <span class="metric-value">${stats.max_latency_ms}ms</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Jitter:</span>
                            <span class="metric-value">${stats.jitter_ms}ms</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Quality:</span>
                            <span class="status-badge ${qualityClass}">${quality}</span>
                        </div>
                    `;

                    document.getElementById('monitor-content').innerHTML = html;

                    if (!running) {
                        clearInterval(monitoringInterval);
                        monitoringInterval = null;
                        monitoringSession = null;
                        resetMonitoringUI();
                    }
                } else {
                    clearInterval(monitoringInterval);
                    document.getElementById('monitor-content').innerHTML = `<div class="error">Error: ${data.error}</div>`;
                    resetMonitoringUI();
                }
            } catch (error) {
                clearInterval(monitoringInterval);
                document.getElementById('monitor-content').innerHTML = `<div class="error">Error: ${error.message}</div>`;
                resetMonitoringUI();
            }
        }

        async function stopMonitoring() {
            if (!monitoringSession) return;

            try {
                await fetch(`/api/stop-monitor/${monitoringSession}`, {
                    method: 'POST'
                });
            } catch (error) {
                console.error('Error stopping monitoring:', error);
            }

            if (monitoringInterval) {
                clearInterval(monitoringInterval);
                monitoringInterval = null;
            }
            monitoringSession = null;
            resetMonitoringUI();
        }

        function resetMonitoringUI() {
            document.getElementById('monitor-btn').style.display = 'block';
            document.getElementById('stop-btn').style.display = 'none';
        }
    </script>
</body>
</html>
