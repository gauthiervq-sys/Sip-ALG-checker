<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIP ALG Checker & Network Monitor</title>
    <!-- Bootstrap CSS from CDN with SRI -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" 
          crossorigin="anonymous">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .main-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 30px;
            margin: 20px auto;
            max-width: 900px;
        }
        h1 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
            font-weight: bold;
        }
        .section-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
            border: 2px solid #e9ecef;
        }
        .section-title {
            color: #495057;
            font-weight: 600;
            margin-bottom: 20px;
            font-size: 1.4rem;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 10px 30px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #5568d3 0%, #65408b 100%);
        }
        .result-container {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: white;
            border: 1px solid #dee2e6;
        }
        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            margin: 10px 0;
        }
        .status-likely {
            background-color: #dc3545;
            color: white;
        }
        .status-unlikely {
            background-color: #28a745;
            color: white;
        }
        .status-possible {
            background-color: #ffc107;
            color: black;
        }
        .quality-excellent {
            color: #28a745;
            font-weight: bold;
        }
        .quality-good {
            color: #20c997;
            font-weight: bold;
        }
        .quality-fair {
            color: #ffc107;
            font-weight: bold;
        }
        .quality-poor {
            color: #dc3545;
            font-weight: bold;
        }
        .check-item {
            background: white;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }
        .spinner-border {
            margin-left: 10px;
        }
        .form-label {
            font-weight: 600;
            color: #495057;
        }
        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e9ecef;
        }
        .metric-label {
            font-weight: 600;
            color: #6c757d;
        }
        .metric-value {
            color: #212529;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-container">
            <h1>🔍 SIP ALG Checker & Network Monitor</h1>
            
            <!-- SIP ALG Section -->
            <div class="section-card">
                <h2 class="section-title">SIP ALG Detection</h2>
                <p>Check if SIP Application Layer Gateway (ALG) is interfering with your VoIP traffic.</p>
                <button id="checkAlgBtn" class="btn btn-primary" onclick="checkSipAlg()">
                    Check SIP ALG
                </button>
                <div id="algResult" class="result-container" style="display: none;">
                    <!-- Results will be displayed here -->
                </div>
            </div>
            
            <!-- Network Monitor Section -->
            <div class="section-card">
                <h2 class="section-title">Network Quality Monitor</h2>
                <p>Monitor network quality parameters including latency, jitter, and packet loss.</p>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="targetHost" class="form-label">Target Host</label>
                        <input type="text" class="form-control" id="targetHost" value="8.8.8.8" placeholder="e.g., 8.8.8.8">
                    </div>
                    <div class="col-md-6">
                        <label for="duration" class="form-label">Duration (seconds)</label>
                        <input type="number" class="form-control" id="duration" value="10" min="5" max="60" placeholder="5-60">
                    </div>
                </div>
                <button id="monitorBtn" class="btn btn-primary" onclick="startMonitor()">
                    Start Monitor
                </button>
                <div id="monitorResult" class="result-container" style="display: none;">
                    <!-- Results will be displayed here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies with SRI -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" 
            crossorigin="anonymous"></script>
    
    <script>
        async function checkSipAlg() {
            const btn = document.getElementById('checkAlgBtn');
            const resultDiv = document.getElementById('algResult');
            
            // Disable button and show loading
            btn.disabled = true;
            btn.innerHTML = 'Checking... <span class="spinner-border spinner-border-sm" role="status"></span>';
            resultDiv.style.display = 'none';
            
            try {
                const response = await fetch('/api/check_alg');
                const data = await response.json();
                
                if (data.error) {
                    resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${data.error}</div>`;
                } else {
                    displayAlgResults(data);
                }
                
                resultDiv.style.display = 'block';
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
                resultDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Check SIP ALG';
            }
        }
        
        function displayAlgResults(data) {
            const resultDiv = document.getElementById('algResult');
            
            let statusClass = 'status-unlikely';
            if (data.sip_alg_detected === 'LIKELY') {
                statusClass = 'status-likely';
            } else if (data.sip_alg_detected === 'POSSIBLE') {
                statusClass = 'status-possible';
            }
            
            let html = `
                <h5>Results</h5>
                <div class="metric-row">
                    <span class="metric-label">Local IP:</span>
                    <span class="metric-value">${data.local_ip}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Status:</span>
                    <span class="status-badge ${statusClass}">${data.sip_alg_detected}</span>
                </div>
                <div class="mt-3">
                    <strong>Recommendation:</strong>
                    <p class="mt-2">${data.recommendation}</p>
                </div>
                <div class="mt-3">
                    <strong>Detailed Checks:</strong>
            `;
            
            data.checks_performed.forEach(check => {
                html += `
                    <div class="check-item">
                        <strong>${check.name}</strong><br>
                        <small class="text-muted">${check.description}</small><br>
                `;
                
                if (check.status) {
                    html += `<span class="badge bg-${check.status === 'PASS' ? 'success' : 'danger'}">${check.status}</span>`;
                }
                if (check.open_ports !== undefined) {
                    html += `<span class="badge bg-info">Open Ports: ${check.open_ports}/5</span>`;
                }
                if (check.behavior) {
                    html += `<span class="badge bg-secondary">${check.behavior}</span>`;
                }
                
                html += `</div>`;
            });
            
            html += `</div>`;
            resultDiv.innerHTML = html;
        }
        
        async function startMonitor() {
            const btn = document.getElementById('monitorBtn');
            const resultDiv = document.getElementById('monitorResult');
            const host = document.getElementById('targetHost').value || '8.8.8.8';
            const duration = parseInt(document.getElementById('duration').value) || 10;
            
            // Validate inputs
            if (duration < 5 || duration > 60) {
                alert('Duration must be between 5 and 60 seconds');
                return;
            }
            
            // Disable button and show loading
            btn.disabled = true;
            btn.innerHTML = `Monitoring... <span class="spinner-border spinner-border-sm" role="status"></span>`;
            resultDiv.style.display = 'none';
            
            try {
                const response = await fetch(`/api/monitor?host=${encodeURIComponent(host)}&duration=${duration}`);
                const data = await response.json();
                
                if (data.error) {
                    resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${data.error}</div>`;
                } else {
                    displayMonitorResults(data);
                }
                
                resultDiv.style.display = 'block';
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
                resultDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Start Monitor';
            }
        }
        
        function displayMonitorResults(data) {
            const resultDiv = document.getElementById('monitorResult');
            
            let qualityClass = 'quality-excellent';
            if (data.quality === 'POOR') {
                qualityClass = 'quality-poor';
            } else if (data.quality === 'FAIR') {
                qualityClass = 'quality-fair';
            } else if (data.quality === 'GOOD') {
                qualityClass = 'quality-good';
            }
            
            let html = `
                <h5>Network Quality Results</h5>
                <div class="metric-row">
                    <span class="metric-label">Target Host:</span>
                    <span class="metric-value">${data.target}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Packets Sent:</span>
                    <span class="metric-value">${data.packets_sent}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Packets Received:</span>
                    <span class="metric-value">${data.packets_received}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Packet Loss:</span>
                    <span class="metric-value ${data.packet_loss_percent > 1 ? 'text-danger' : 'text-success'}">
                        ${data.packet_loss_percent}%
                    </span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Average Latency:</span>
                    <span class="metric-value">${data.avg_latency_ms} ms</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Min Latency:</span>
                    <span class="metric-value">${data.min_latency_ms} ms</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Max Latency:</span>
                    <span class="metric-value">${data.max_latency_ms} ms</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Jitter:</span>
                    <span class="metric-value ${data.jitter_ms > 20 ? 'text-danger' : 'text-success'}">
                        ${data.jitter_ms} ms
                    </span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Quality Assessment:</span>
                    <span class="metric-value ${qualityClass}">${data.quality}</span>
                </div>
            `;
            
            resultDiv.innerHTML = html;
        }
    </script>
</body>
</html>
